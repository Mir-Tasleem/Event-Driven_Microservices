spring:
  main:
    web:
      application-type: none
  application:
    name: notificationservice

  datasource:
    url: jdbc:postgresql://pg-notification:5432/notification_db
    username: notification_user
    password: notification_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always


logging:
  level:
    root: INFO
