apiVersion: apps/v1
kind: Statefulset
metadata:
  name: zookeeper
  namespace: ecomerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          livenessProbe:
            exec:
              command: ["nc", "-z", "localhost", "2181"]
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: ecomerce
spec:
  selector:
    app: zookeeper
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 2181
      targetPort: 2181
