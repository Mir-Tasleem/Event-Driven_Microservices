spring:
  main:
    web:
      application-type: none
  application:
    name: inventoryservice

  datasource:
    url: jdbc:postgresql://pg-inventory:5432/inventory_db
    username: inventory_user
    password: inventory_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

logging:
  level:
    root: INFO
