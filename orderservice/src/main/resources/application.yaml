server:
  port: 8080

spring:
  application:
    name: order-svc

  datasource:
    url: jdbc:postgresql://pg-order:5432/order_db
    username: order_user
    password: order_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-components: always
        show-details: always


logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
